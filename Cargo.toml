[workspace]
resolver = "3"
members = [
    "crates/lb-app",
    "crates/lb-catalog",
    "crates/lb-cli",
    "crates/lb-core",
    "crates/lb-faces",
    "crates/lb-geo",
    "crates/lb-imaging",
    "crates/lb-jobs",
    "crates/lb-media",
    "crates/lb-picasa",
    "crates/lb-scan",
    "crates/lb-search",
    "crates/lb-testkit",
    "crates/lb-thumbs",
    "crates/lb-ui",
    "crates/lb-video",
    "apps/lightbox",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "=1.0.104"
assert_cmd = "=2.2.2"
blake3 = "=1.8.7"
chrono = "=0.4.45"
clap = { version = "=4.6.7", features = ["derive"] }
criterion = "=0.8.2"
crossbeam-channel = "=0.5.17"
directories = "=6.0.0"
fast_image_resize = "=6.1.0"
gpui-kit = "=0.7.3"
image = { version = "=0.25.10", default-features = false }
insta = "=1.49.0"
kamadak-exif = "=0.6.1"
parking_lot = "=0.12.5"
predicates = "=3.1.4"
pretty_assertions = "=1.4.1"
proptest = "=1.12.0"
rayon = "=1.12.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "functions", "chrono"] }
rusqlite_migration = "=2.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.1.8"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
walkdir = "=2.5.0"
winnow = "=1.0.4"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.lb-testkit]
opt-level = 2
